services:
  tracker:
    build:
      context: .
      dockerfile: ./apps/tracker/Dockerfile
      target: development
    command: npm run start:dev tracker
    env_file:
      - ./apps/tracker/.env
    depends_on:
      - location
      - auth
      - rabbitmq
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - '3000:3000'

  location:
    build:
      context: .
      dockerfile: ./apps/location/Dockerfile
      target: development
    command: npm run start:dev location
    env_file:
      - ./apps/location/.env
    depends_on:
      - rabbitmq
      - auth
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
  auth:
    build:
      context: .
      dockerfile: ./apps/auth/Dockerfile
      target: development
    command: npm run start:dev auth
    ports:
      - '3001:3001'
    env_file:
      - ./apps/auth/.env
    depends_on:
      - rabbitmq
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

  rabbitmq:
    image: rabbitmq
    ports:
      - '5672:5672'